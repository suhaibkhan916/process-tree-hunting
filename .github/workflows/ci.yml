name: ci
on: [push, pull_request]
# Least privilege: the jobs only read the code.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
      - name: Windows sample is reproducible from its seed
        run: python make_windows_sample.py && git diff --exit-code data/
      - name: Scorecard and hunt reports
        run: |
          python -m ptree score
          python -m ptree hunt data/incident.log --baseline data/baseline.log || test $? -eq 1
          python -m ptree hunt data/windows_incident.xml --baseline data/windows_baseline.xml || test $? -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
